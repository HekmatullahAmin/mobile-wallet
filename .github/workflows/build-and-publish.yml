name: Build ios and publish to firebase

on:
  workflow_dispatch:
    inputs:

      build_ios:
        type: boolean
        default: false
        description: Build ios app

      distribute_ios_firebase:
        type: boolean
        default: false
        description: Distribute iOS App to firebase

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: "reusable"
  cancel-in-progress: false

jobs:
  Build_ios:
    name: Build ios
    if: ${{ inputs.build_ios }}
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup latest Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Generate dummy framework for KMP
        run: ./gradlew cmp-shared:generateDummyFramework

      - name: Install CocoaPods dependencies (once to configure Gradle)
        working-directory: 'cmp-ios'
        run: pod install

      - name: Prebuild KMP iOS framework
        run: |
          set -ev
          KOTLIN_PROJECT_PATH=":cmp-shared"
          PLATFORM_NAME="iphoneos"
          ARCHS="arm64"
          CONFIGURATION="Release"
          REPO_ROOT="$PODS_TARGET_SRCROOT"
          
          "$REPO_ROOT/../gradlew" -p "$REPO_ROOT" $KOTLIN_PROJECT_PATH:syncFramework \
              -Pkotlin.native.cocoapods.platform=$PLATFORM_NAME \
              -Pkotlin.native.cocoapods.archs="$ARCHS" \
              -Pkotlin.native.cocoapods.configuration="$CONFIGURATION"

      - name: Install CocoaPods dependencies (final with skip)
        working-directory: 'cmp-ios'
        env:
          OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED: YES
        run: pod install

      - name: Build iOS App
        uses: openMF/mifos-x-actionhub-build-ios-app@v1.0.2
        with:
          build_type: 'Release'
          app_identifier: 'org.mifospay'
          git_url: 'git@github.com:openMF/ios-provisioning-profile.git'
          git_branch: 'mifospay'
          match_type: 'adhoc'
          provisioning_profile_name: 'match AdHoc org.mifospay'
          appstore_key_id: ${{ secrets.APPSTORE_KEY_ID }}
          appstore_issuer_id: ${{ secrets.APPSTORE_ISSUER_ID }}
          appstore_auth_key: ${{ secrets.APPSTORE_AUTH_KEY }}
          match_password: ${{ secrets.MATCH_PASSWORD }}
          match_ssh_private_key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}

  Publish_to_Firebase:
    name: Publish fiebase
    if: ${{ inputs.distribute_ios_firebase }}
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup latest Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Generate dummy framework for KMP
        run: ./gradlew cmp-shared:generateDummyFramework

      - name: Install CocoaPods dependencies
        working-directory: 'cmp-ios'
        run: pod install

      - name: Deploy iOS App to Firebase
        uses: openMF/kmp-publish-ios-on-firebase-action@v1.0.2
        continue-on-error: true
        with:
          app_identifier: 'org.mifospay'
          git_url: 'git@github.com:openMF/ios-provisioning-profile.git'
          git_branch: 'mifospay'
          match_type: 'adhoc'
          provisioning_profile_name: 'match AdHoc org.mifospay'
          appstore_key_id: ${{ secrets.APPSTORE_KEY_ID }}
          appstore_issuer_id: ${{ secrets.APPSTORE_ISSUER_ID }}
          appstore_auth_key: ${{ secrets.APPSTORE_AUTH_KEY }}
          match_password: ${{ secrets.MATCH_PASSWORD }}
          match_ssh_private_key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
          ios_package_name: 'cmp-ios'
          firebase_app_id: '1:728434912738:ios:86a7badfaed88b841a1dbb'
          firebase_creds: ${{ secrets.FIREBASECREDS }}
          tester_groups: 'mifos-mobile-apps'
