name: Build ios and publish to firebase

on:
  workflow_dispatch:
    inputs:

      build_ios:
        type: boolean
        default: false
        description: Build ios app

      distribute_ios_firebase:
        type: boolean
        default: false
        description: Distribute iOS App to firebase

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: "reusable"
  cancel-in-progress: false

jobs:
  Build_ios:
    name: Build ios
    if: ${{ inputs.build_ios }}
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup latest Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Generate dummy framework for KMP
        run: ./gradlew cmp-shared:generateDummyFramework

      - name: Install CocoaPods dependencies
        working-directory: 'cmp-ios'
        run: pod install

      - name: Build iOS App
        uses: openMF/mifos-x-actionhub-build-ios-app@v1.0.2
        with:
          build_type: 'Release'
          app_identifier: 'org.mifospay'
          git_url: 'git@github.com:openMF/ios-provisioning-profile.git'
          git_branch: 'mifospay'
          match_type: 'adhoc'
          provisioning_profile_name: 'match AdHoc org.mifospay'
          appstore_key_id: ${{ secrets.APPSTORE_KEY_ID }}
          appstore_issuer_id: ${{ secrets.APPSTORE_ISSUER_ID }}
          appstore_auth_key: ${{ secrets.APPSTORE_AUTH_KEY }}
          match_password: ${{ secrets.MATCH_PASSWORD }}
          match_ssh_private_key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}