name: Build iOS and publish to Firebase

on:
  workflow_dispatch:
    inputs:
      build_ios:
        type: boolean
        default: false
        description: Build iOS app
      distribute_ios_firebase:
        type: boolean
        default: false
        description: Distribute iOS App to Firebase

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: "reusable"
  cancel-in-progress: false

jobs:
  Build_ios:
    name: Build iOS
    if: ${{ inputs.build_ios }}
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: v1-gradle-${{ hashFiles('cmp-shared/build.gradle.kts') }}
          restore-keys: |
            v1-gradle-

      - name: Setup Latest Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Restore CocoaPods Cache
        uses: actions/cache@v4
        with:
          path: cmp-ios/Pods
          key: v1-pods-${{ hashFiles('cmp-ios/Podfile.lock') }}
          restore-keys: |
            v1-pods-

      - name: Generate Dummy Framework for KMP
        run: ./gradlew cmp-shared:generateDummyFramework --stacktrace

      - name: Install CocoaPods Dependencies
        working-directory: cmp-ios
        run: pod install

      - name: Build iOS App
        uses: openMF/mifos-x-actionhub-build-ios-app@v1.0.2
        with:
          build_type: 'Release'
          app_identifier: 'org.mifospay'
          git_url: 'git@github.com:openMF/ios-provisioning-profile.git'
          git_branch: 'mifospay'
          match_type: 'adhoc'
          provisioning_profile_name: 'match AdHoc org.mifospay'
          appstore_key_id: ${{ secrets.APPSTORE_KEY_ID }}
          appstore_issuer_id: ${{ secrets.APPSTORE_ISSUER_ID }}
          appstore_auth_key: ${{ secrets.APPSTORE_AUTH_KEY }}
          match_password: ${{ secrets.MATCH_PASSWORD }}
          match_ssh_private_key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}

  Publish_to_Firebase:
    name: Publish fiebase
    if: ${{ inputs.distribute_ios_firebase }}
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup latest Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Generate dummy framework for KMP
        run: ./gradlew cmp-shared:generateDummyFramework

      - name: Install CocoaPods dependencies
        working-directory: 'cmp-ios'
        run: pod install

      - name: Deploy iOS App to Firebase
        uses: openMF/kmp-publish-ios-on-firebase-action@v1.0.2
        continue-on-error: true
        with:
          app_identifier: 'org.mifospay'
          git_url: 'git@github.com:openMF/ios-provisioning-profile.git'
          git_branch: 'mifospay'
          match_type: 'adhoc'
          provisioning_profile_name: 'match AdHoc org.mifospay'
          appstore_key_id: ${{ secrets.APPSTORE_KEY_ID }}
          appstore_issuer_id: ${{ secrets.APPSTORE_ISSUER_ID }}
          appstore_auth_key: ${{ secrets.APPSTORE_AUTH_KEY }}
          match_password: ${{ secrets.MATCH_PASSWORD }}
          match_ssh_private_key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
          ios_package_name: 'cmp-ios'
          firebase_app_id: '1:728434912738:ios:86a7badfaed88b841a1dbb'
          firebase_creds: ${{ secrets.FIREBASECREDS }}
          tester_groups: 'mifos-mobile-apps'
