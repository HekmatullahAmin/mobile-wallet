  Publish_to_Firebase:
    name: Publish fiebase
    if: ${{ inputs.distribute_ios_firebase }}
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup latest Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

#      - name: Precreate compose resources dir (for KMP CocoaPods)
#        run: mkdir -p cmp-shared/build/compose/cocoapods/compose-resources

      - name: Generate Dummy Framework for KMP
        run: ./gradlew cmp-shared:generateDummyFramework --stacktrace

      # Use Podfile.lock to pick a compatible CocoaPods version if needed
      - name: Setup CocoaPods based on Podfile.lock
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          podfile-path: cmp-ios/Podfile.lock

      - name: Sanity check Ruby/CocoaPods
        run: |
          which ruby && ruby -v
          which pod && pod --version    

#      - name: Install CocoaPods
