name: Build iOS and publish to Firebase

on:
  workflow_dispatch:
    inputs:
      build_ios:
        type: boolean
        default: false
        description: Build iOS app
      distribute_ios_firebase:
        type: boolean
        default: false
        description: Distribute iOS App to Firebase

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: "reusable"
  cancel-in-progress: false

jobs:
  Build_ios:
    name: Build iOS
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Optional but nice-to-have for Gradle
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Install Fastlane
        run: |
          gem install bundler:2.5.23
          bundle install --jobs 4 --retry 3

      - name: Set up App Store Auth Key
        env:
          AUTH_KEY: ${{ secrets.APPSTORE_AUTH_KEY }}
        run: |
          mkdir -p secrets
          echo "$AUTH_KEY" | base64 --decode > secrets/Auth_key.p8

      - name: Set up SSH for Match
        env:
          MATCH_SSH_PRIVATE_KEY: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$MATCH_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/match_ci_key
          chmod 600 ~/.ssh/match_ci_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          printf "Host github.com\n  IdentityFile ~/.ssh/match_ci_key\n  StrictHostKeyChecking no\n" >> ~/.ssh/config

      - name: Precreate compose resources dir (for KMP CocoaPods)
        run: mkdir -p cmp-shared/build/compose/cocoapods/compose-resources

      - name: Generate Dummy Framework for KMP
        run: ./gradlew -Pkmp.ios.deviceOnly=true cmp-shared:generateDummyFramework --stacktrace
#        run: ./gradlew cmp-shared:generateDummyFramework --stacktrace

      # Use Podfile.lock to pick a compatible CocoaPods version if needed
      - name: Setup CocoaPods based on Podfile.lock
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          podfile-path: cmp-ios/Podfile.lock

      # Install CocoaPods into the ruby/setup-ruby environment (no sudo)
#      - name: Install CocoaPods
#        run: |
#          cd cmp-ios
#          pod install --verbose

      - name: Sanity check Ruby/CocoaPods
        run: |
          which ruby && ruby -v
          which pod && pod --version   

      - name: Build signed iOS App
        env:
          OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED: "YES"   # <— skip script phase
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GIT_URL: "git@github.com:openMF/ios-provisioning-profile.git"
          GIT_BRANCH: "mifospay"
          MATCH_TYPE: "adhoc"
          APP_IDENTIFIER: "org.mifospay"
          PROVISIONING_PROFILE_NAME: "match AdHoc org.mifospay"
        run: |
          bundle exec fastlane ios build_signed_ios \
            appstore_key_id:"$APPSTORE_KEY_ID" \
            appstore_issuer_id:"$APPSTORE_ISSUER_ID" \
            key_filepath:secrets/Auth_key.p8 \
            git_private_key:~/.ssh/match_ci_key \
            match_password:"$MATCH_PASSWORD" \
            git_url:"$GIT_URL" \
            git_branch:"$GIT_BRANCH" \
            match_type:"$MATCH_TYPE" \
            app_identifier:"$APP_IDENTIFIER" \
            provisioning_profile_name:"$PROVISIONING_PROFILE_NAME"
